name: Backend baseline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLOWVALUE_CLOUD: 'false'
      FLOWVALUE_AI_RESPONSE_CACHE: 'false'
      FLOWVALUE_ASSESSMENT_DB: /tmp/flowvalue-ci-synthetic.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: python tools/phase0_baseline_checks.py
      - run: python -m pip install -r backend/requirements-phase0-tests.txt
      - run: python -m pip check
      # No provider credentials or production database are supplied to this job.
      - run: python -m pytest backend -q --tb=short
