[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowvalue-api"
version = "0.1.0"
description = "FlowValue AI techno-economic assessment API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "python-multipart", "pandas", "numpy", "scipy", "openpyxl", "defusedxml"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
